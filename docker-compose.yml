# All the containers to run.
services:
  api:
    build:
      context: '.'
      dockerfile: 'Dockerfile'
      target: 'server'

    container_name: 'api'

    ports:
      - '${PASSKEYS_API_PORT:-}:8080'

    environment:
      - 'HELLO=vapid@webgl3d.dev'

    env_file:
      - .dev.vars

    restart: 'always'

  app:
    build:
      context: '.'
      dockerfile: 'Dockerfile'
      target: 'final'

    container_name: 'app'

    ports:
      - '${PASSKEYS_APP_PORT:-}:3000'

    restart: 'always'

# Ensure all the services in this docker-compose file connect to the tix-factory docker network.
networks:
  default:
    name: 'tix-factory'
    external: true
